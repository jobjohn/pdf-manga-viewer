name: Release

# v0.0.2 のようなタグを push すると MSI をビルドして GitHub Release に公開する
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build MSI
        id: build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./installer/build-installer.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $msi = "installer/dist/PdfMangaViewer-Setup-$env:VERSION.msi"
          gh release create $env:GITHUB_REF_NAME $msi `
            --verify-tag `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
